# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets (needed so Nuxt build gets Firebase config).
# Create these in Google Cloud Secret Manager, then run for each:
#   firebase apphosting:secrets:set NUXT_PUBLIC_FIREBASE_API_KEY
#   (and same for the other names). Or create in Console: Secret Manager → Create secret.
env:
  - variable: NUXT_PUBLIC_FIREBASE_API_KEY
    secret: NUXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
  - variable: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
  - variable: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
  - variable: NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
  - variable: NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
  - variable: NUXT_PUBLIC_FIREBASE_APP_ID
    secret: NUXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
  # Web Push certificate key pair. Without it the browser cannot request a push
  # token, so the notification opt-in fails silently — no build error and no
  # runtime warning on the site. CI injects it for the Hosting build; App
  # Hosting is the live deploy and was missing it entirely.
  - variable: NUXT_PUBLIC_FIREBASE_VAPID_KEY
    secret: NUXT_PUBLIC_FIREBASE_VAPID_KEY
    availability:
      - BUILD
  # Flickr, for the event and darshan galleries. useFlickr() returns nothing at
  # all when the key is absent, so the albums render empty rather than broken.
  #
  # NUXT_PUBLIC_FLICKR_USER_ID is deliberately absent: nothing reads it. The
  # only Flickr call the app makes is flickr.photosets.getPhotos, and a
  # photoset id is globally unique, so it needs no owner. The variable is
  # declared in nuxt.config.ts and injected by the Hosting workflow, but no
  # code consumes it — so requiring a Secret Manager entry for it would be
  # asking for a secret to feed a value that is never read.
  - variable: NUXT_PUBLIC_FLICKR_API_KEY
    secret: NUXT_PUBLIC_FLICKR_API_KEY
    availability:
      - BUILD
